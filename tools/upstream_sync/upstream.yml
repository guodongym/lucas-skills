upstreams:
  - name: anthropics-skills
    repo: https://github.com/anthropics/skills
    branch: main
    mappings:
      - src: skills/skill-creator     # 上游路径（相对于仓库根）
        dst: skills/skill-creator     # 本地目标路径（相对于仓库根）
      - src: skills/frontend-design
        dst: skills/frontend-design
      - src: skills/pdf
        dst: skills/pdf
      - src: skills/docx
        dst: skills/docx
      - src: skills/xlsx
        dst: skills/xlsx

  - name: khazix-skills
    repo: https://github.com/KKKKhazix/khazix-skills
    branch: main
    mappings:
      - src: hv-analysis
        dst: skills/hv-analysis
      - src: khazix-writer
        dst: skills/khazix-writer
      - src: neat-freak
        dst: skills/neat-freak
      - src: storage-analyzer
        dst: skills/storage-analyzer

  - name: human-writing
    repo: https://github.com/KKKKhazix/human-writing
    branch: main
    mappings:
      - src: human-writing
        dst: skills/human-writing

  # 示例：添加更多上游
  # - name: my-other-upstream
  #   repo: https://github.com/user/repo
  #   branch: main
  #   mappings:
  #     - src: path/in/upstream
  #       dst: skills/local-name

  # 官方 Skill 只通过发布 ZIP 提供，不在 Git 仓库中。
  - name: wps365
    type: release-zip
    version_url: https://open-docs.wpscdn.cn/cli/latest.txt
    archive_url: https://open-docs.wpscdn.cn/cli/releases/download/v{version}/wps365-skills-{version}.zip
    archive_root: wps365-skills
    dst: skills/wps365/.official
    manifest: skills/wps365/upstream.json
    guide: https://365.kdocs.cn/wiki/l/0lcqi8RexYzQKD
